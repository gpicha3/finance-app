<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9fe3ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b2a3f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <title>Finance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="shell">
    <header class="app-bar">
      <div class="titles"><h1 id="pageTitle">วันนี้</h1><small id="pageSub"></small></div>
      <button class="icon-btn" id="syncBtn" aria-label="อัปเดตข้อมูล"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg></button>
      <button class="icon-btn" data-open="settings" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="8.5" cy="17" r="2.5"/></svg></button>
    </header>

    <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg></div>

    <main class="scroll" id="scroll">
      <div class="page" id="page">
        <section class="view" id="view-today"></section>
        <section class="view" id="view-cycles" hidden></section>
        <section class="view" id="view-fixed" hidden></section>
        <section class="view" id="view-loans" hidden></section>
      </div>
    </main>

    <nav class="tabs" id="tabs" aria-label="เมนูหลัก">
      <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>วันนี้</span></button>
      <button data-tab="cycles"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg><span>รอบเงินเดือน</span></button>
      <button data-tab="fixed"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8.5h5M9.5 12.5h5"/></svg><span>Fixed cost</span></button>
      <button data-tab="loans"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg><span>การผ่อน</span></button>
    </nav>
  </div>

  <section id="settings" class="sheet" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>ตั้งค่า</h1>
      <span class="spacer"></span>
    </header>
    <div class="set-page">
      <h3 class="set-title">โหมด</h3>
      <div class="segmented" id="themeSeg">
        <button type="button" data-theme-mode="auto">อัตโนมัติ</button>
        <button type="button" data-theme-mode="light">สว่าง</button>
        <button type="button" data-theme-mode="dark">มืด</button>
      </div>

      <h3 class="set-title">Google Sheet</h3>
      <section class="panel">
        <div class="set-row" id="connCard">
          <div class="set-text">
            <b>เชื่อมต่อแล้ว</b>
            <small id="connUrl"></small>
            <small id="connSynced"></small>
          </div>
          <span class="conn-dot" aria-hidden="true"></span>
        </div>
        <div class="set-actions" id="connActions">
          <button type="button" class="btn ghost" id="editLinkBtn">แก้ Setup code</button>
          <button type="button" class="btn danger" id="clearSetupBtn">เลิกเชื่อมต่อ</button>
        </div>
        <div id="setupEditor" class="setup">
          <label class="field">
            <span>Setup code</span>
            <textarea id="setupInput" rows="4" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
            <small class="hint">วางลิงก์ Web app ตามด้วย ?k= และ TOKEN ที่ตั้งไว้ใน Apps Script</small>
          </label>
          <p id="settingsStatus" class="hint"></p>
          <div class="set-actions flush">
            <button type="button" class="btn ghost" id="cancelEditBtn">ยกเลิก</button>
            <button type="button" class="btn primary" id="saveSetupBtn">เชื่อมต่อ</button>
          </div>
        </div>
      </section>

      <p class="set-foot">Finance · <span id="appVersion"></span></p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
