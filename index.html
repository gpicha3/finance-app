<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <title>Finance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="shell">
    <header class="home-bar">
      <button class="icon-btn" data-open="settings" aria-label="ตั้งค่า"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.90 12.00 L22.15 12.96 L21.75 15.00 L19.30 15.02 L18.57 16.39 L17.59 17.59 L18.50 19.86 L16.77 21.01 L15.02 19.30 L13.54 19.75 L12.00 19.90 L11.04 22.15 L9.00 21.75 L8.98 19.30 L7.61 18.57 L6.41 17.59 L4.14 18.50 L2.99 16.77 L4.70 15.02 L4.25 13.54 L4.10 12.00 L1.85 11.04 L2.25 9.00 L4.70 8.98 L5.43 7.61 L6.41 6.41 L5.50 4.14 L7.23 2.99 L8.98 4.70 L10.46 4.25 L12.00 4.10 L12.96 1.85 L15.00 2.25 L15.02 4.70 L16.39 5.43 L17.59 6.41 L19.86 5.50 L21.01 7.23 L19.30 8.98 L19.75 10.46Z M15.2 12 a3.2 3.2 0 1 0 -6.4 0 a3.2 3.2 0 1 0 6.4 0z"/></svg></button>
      <h1 class="app-title">Finance</h1>
      <button class="icon-btn" id="syncBtn" aria-label="อัปเดตข้อมูล"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 4a8 8 0 0 1 7.4 5H17a1 1 0 0 0 0 2h4.5a1 1 0 0 0 1-1V5.5a1 1 0 1 0-2 0v1.7A10 10 0 0 0 2.1 10.9a1 1 0 0 0 2 .3A8 8 0 0 1 12 4zM21 12.8a1 1 0 0 0-1.1.9A8 8 0 0 1 4.6 15H7a1 1 0 1 0 0-2H2.5a1 1 0 0 0-1 1v4.5a1 1 0 1 0 2 0v-1.7a10 10 0 0 0 18.4-3.7 1 1 0 0 0-.9-1.3z"/></svg></button>
    </header>

    <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg></div>

    <main class="home-scroll" id="homeScroll">
      <div class="page-inner" id="homeInner">
        <div id="home"></div>
        <nav class="menu">
          <button class="menu-row" data-open="cycles">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM6 11v3h3v-3zM10.5 11v3h3v-3zM15 11v3h3v-3zM6 15.5v3h3v-3zM10.5 15.5v3h3v-3z"/></svg>
            <span class="menu-text"><b>รอบเงินเดือน</b><small id="mCycles"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="fixed">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM7 7.5v2h10v-2zM7 11v2h10v-2zM7 14.5v2h6v-2z"/></svg>
            <span class="menu-text"><b>Fixed cost</b><small id="mFixed"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="loans">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2 7a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1H2zM2 10.5h20V17a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3zM5.5 15v2h5v-2z"/></svg>
            <span class="menu-text"><b>การผ่อน</b><small id="mLoans"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </nav>
      </div>
    </main>
  </div>

  <section id="cycles" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>รอบเงินเดือน</h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body" id="cyclesBody"></div>
  </section>

  <section id="fixed" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>Fixed cost</h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body" id="fixedBody"></div>
  </section>

  <section id="loans" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>การผ่อน</h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body" id="loansBody"></div>
  </section>

  <section id="settings" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="ย้อนกลับ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>ตั้งค่า</h1>
      <span class="spacer"></span>
    </header>
    <div class="set-page">
      <h3 class="set-title">หน้าตา</h3>
      <section class="set-group">
        <div class="set-row stack">
          <b>โหมด</b>
          <div class="segmented wide" id="themeSeg">
            <button type="button" data-theme-mode="auto">อัตโนมัติ</button>
            <button type="button" data-theme-mode="light">สว่าง</button>
            <button type="button" data-theme-mode="dark">มืด</button>
          </div>
        </div>
        <div class="set-row stack">
          <b>สีหลัก</b>
          <div class="swatches" id="swatches"></div>
        </div>
      </section>

      <h3 class="set-title">Google Sheet</h3>
      <section class="set-group">
        <div class="set-row" id="connCard">
          <div class="set-text">
            <b>เชื่อมต่อแล้ว</b>
            <small id="connUrl"></small>
            <small id="connSynced"></small>
          </div>
          <span class="conn-dot"></span>
        </div>
        <div class="set-actions" id="connActions">
          <button type="button" class="set-btn" id="editLinkBtn">แก้ Setup code</button>
          <button type="button" class="set-btn danger" id="clearSetupBtn">เลิกเชื่อมต่อ</button>
        </div>
        <div class="set-row stack" id="setupEditor">
          <label class="field">
            <span>Setup code</span>
            <textarea id="setupInput" rows="4" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
            <small class="hint">วางลิงก์ Web app ตามด้วย ?k= และ TOKEN ที่ตั้งไว้ใน Apps Script</small>
          </label>
          <p id="settingsStatus" class="hint"></p>
          <div class="form-actions">
            <button type="button" class="btn ghost" id="cancelEditBtn">ยกเลิก</button>
            <button type="button" class="btn primary" id="saveSetupBtn">เชื่อมต่อ</button>
          </div>
        </div>
      </section>

      <p class="set-foot">Finance · <span id="appVersion"></span></p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
